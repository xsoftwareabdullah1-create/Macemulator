plugins {
    id 'com.android.application'
}

android {
    namespace 'com.macemulator.desktop'
    compileSdk 35

    defaultConfig {
        applicationId 'com.macemulator.desktop'
        minSdk 29
        targetSdk 28
        versionCode 2
        versionName '0.2.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
